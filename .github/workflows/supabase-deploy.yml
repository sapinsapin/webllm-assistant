# Deploys database migrations and edge functions to the production Supabase
# project whenever supabase/ changes land on main (or on manual dispatch).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   — the project's database password
# The project ref is read from supabase/config.toml.
name: Supabase deploy

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Fail early if secrets are missing
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets, then re-run this workflow."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: |
          PROJECT_REF=$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml)
          supabase link --project-ref "$PROJECT_REF"

      - name: Push migrations
        run: supabase db push

      - name: Deploy edge functions
        run: supabase functions deploy
